# Parcours d'inscription complet côté ORGANISATRICE : infos, pièce
# d'identité (fausse carte de test, voir signup-participant.yaml), OCR
# Vision, bypass Face ID dev, spécialités (pas de limite à 5 contrairement
# aux préférences participante), création de compte — puis connexion avec
# le compte tout juste créé pour vérifier que le rôle "organizer" a bien
# été persisté et que le canal de l'organisatrice a été créé automatiquement
# par le trigger SQL `trg_ensure_organizer_channel` (voir
# supabase/migrations/20260928010000_rls_and_triggers.sql).
#
# Vérifier la ligne `channels` elle-même nécessiterait soit une requête
# SQL directe (hors du périmètre d'un flow Maestro, qui ne pilote que
# l'UI), soit de devenir amie du nouveau compte pour atteindre le bouton
# "Voir son canal" sur app/profile/[id].tsx — trop lourd pour ce flow. On
# vérifie donc indirectement via deux surfaces UI qui dépendent toutes
# les deux de profile.role === "organizer" (et donc, transitivement, du
# même insert qui déclenche la création du canal) :
#   1. le bouton "+" du fil d'accueil (testID button-create-event,
#      visible uniquement pour une organisatrice) ;
#   2. l'écran de création d'événement lui-même, qui redirige vers les
#      tabs (app/event/create.tsx, useEffect) si profile.role !==
#      "organizer" — donc atteindre son titre confirme qu'aucune
#      redirection n'a eu lieu.
# La création d'événement complète (soumission du formulaire, qui
# vérifie réellement l'existence de la ligne `channels` côté serveur)
# est couverte par le flow event-create-and-register.yaml (backlog
# suivant), pas ici.
#
# Usage (email unique à chaque run pour éviter "compte déjà existant") :
#   maestro test \
#     --env SIGNUP_EMAIL=test.e2e.organizer.$(date +%s)@example.com \
#     --env SIGNUP_PASSWORD=motdepasse123 \
#     .maestro/signup-organizer.yaml
#
# Prérequis : identiques à signup-participant.yaml (pellicule du
# Simulator avec au moins une photo, accès Photos déjà accordé une fois).
appId: com.nicolaspoda.sistrs
---
- launchApp:
    clearState: true
# Premier lancement après clearState : Metro doit resservir/recharger le
# bundle JS, ce qui dépasse le délai d'attente implicite par défaut de
# Maestro sur certaines machines — on attend explicitement plus longtemps.
- extendedWaitUntil:
    visible: "S'inscrire"
    timeout: 30000
- tapOn: "S'inscrire"

# --- Étape 1 : Tes informations ---
- tapOn:
    id: "input-first-name"
- inputText: "Camille"
- tapOn:
    id: "input-last-name"
- inputText: "Dubois"
- tapOn: "Tes informations"  # tap sur un texte statique pour fermer le clavier (hideKeyboard non fiable ici)

# Date de naissance : on garde le défaut pré-sélectionné par l'app
# ("aujourd'hui - 25 ans", toujours majeure) plutôt que de naviguer le
# calendrier.
- tapOn:
    id: "input-birth-date"
- tapOn: "Valider"

- tapOn:
    id: "input-email"
- inputText: "${SIGNUP_EMAIL}"
# Maestro/XCTest ne saisit pas fiablement dans un UITextField avec
# secureTextEntry actif (texte tapé qui n'atterrit jamais dans le champ, ou
# de façon corrompue si on bascule la visibilité pendant la frappe — le
# TextInput se re-crée côté natif) — on bascule les deux champs en "mot de
# passe visible" AVANT de taper quoi que ce soit, puis on ne retouche plus
# au bouton oeil.
- tapOn:
    id: "input-password-toggle-visibility"
- tapOn:
    id: "input-confirm-password-toggle-visibility"
- tapOn:
    id: "input-password"
- inputText: "${SIGNUP_PASSWORD}"
- tapOn:
    id: "input-confirm-password"
- inputText: "${SIGNUP_PASSWORD}"
- tapOn: "Tes informations"  # tap sur un texte statique pour fermer le clavier (hideKeyboard non fiable ici)

# "Participante" est le rôle par défaut (voir app/(auth)/_signup-draft.tsx)
# — c'est tout l'objet de ce flow de basculer explicitement sur
# "Organisatrice".
- tapOn:
    id: "role-organizer"

# --- Pièce d'identité ---
# Raccourci développeur (charge la fausse carte directement depuis les
# assets de l'app), voir signup-participant.yaml pour le détail.
- tapOn:
    id: "link-dev-use-test-id"
- assertVisible: "Pièce d'identité ajoutée ✓"

- tapOn:
    id: "button-continue-step1"

# L'OCR peut renvoyer un avertissement si la date lue sur la pièce ne
# correspond pas à la date de naissance saisie (voir
# signup-participant.yaml) — on retape sur le bouton seulement si besoin.
- runFlow:
    when:
      visible: "Continuer quand même"
    commands:
      - tapOn:
          id: "button-continue-step1"

# --- Étape 2 : Tes spécialités (pas de limite à 5, contrairement aux
#     préférences participante) ---
- tapOn:
    id: "age-bracket-18-25"
- tapOn: "Bar"
- tapOn: "Ciné"
- tapOn:
    id: "link-dev-bypass-faceid"
- assertVisible: "Face ID activé ✓"

- tapOn:
    id: "button-create-account"
- assertVisible: "Compte créé avec succès.*"

# --- Connexion avec le compte tout juste créé ---
# La création de compte déconnecte volontairement (choix produit, voir
# app/(auth)/sign-up-preferences.tsx) et renvoie vers l'écran de
# connexion : on réutilise login.yaml avec les identifiants qu'on vient
# de créer.
- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: "${SIGNUP_EMAIL}"
      TEST_PASSWORD: "${SIGNUP_PASSWORD}"

# --- Vérification indirecte : rôle organisatrice + canal auto-créé ---
- assertVisible:
    id: "button-create-event"
- tapOn:
    id: "button-create-event"
- assertVisible: "Créer un événement"
